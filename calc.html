<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM Manipulation</title>
</head>
<style>
    body 
    {
            font-family: Arial, sans-serif;

            height: 100vh;
            margin: 0;
    }
    .app-container

            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            padding: 10px;

            border: 2px solid #bcbaba;

            color: #333;
    }
    .btn-calculate

            border: none;
            border-radius: 5px;

    .btn-calculate:hover
